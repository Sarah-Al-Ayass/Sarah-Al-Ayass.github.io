<style>
:root{
  --navy:#0B1B33; --navy2:#12284A; --black:#07090F; --white:#FFFFFF; --off:#F6F5F1;
  --ink:#0E1626; --muted:#5A6476; --line:#E3E1DA;
  --gold:#C9A54E; --gold2:#E2C57A; --goldInk:#9A7524; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:var(--white);color:var(--ink);line-height:1.6;font-size:16px;overflow-x:hidden}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}

/* nav */
nav{position:sticky;top:0;z-index:10;background:rgba(11,27,51,.94);backdrop-filter:blur(10px);border-bottom:1px solid rgba(201,165,78,.25)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-family:Fraunces,Georgia,serif;font-weight:700;color:var(--gold);text-decoration:none;font-size:20px;letter-spacing:1px}
.links{display:flex;gap:26px;align-items:center}
.links a{text-decoration:none;color:#C7CEDB;font-size:14px;font-weight:500;transition:color .2s}
.links a:hover{color:var(--gold2)}
.lang{display:flex;border:1px solid rgba(255,255,255,.2);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:#C7CEDB;font:600 12px Inter,sans-serif;padding:6px 11px;cursor:pointer}
.lang button.on{background:var(--gold);color:var(--black)}

/* hero: navy band with subtle texture */
.hero{padding:96px 0 80px;color:#fff;position:relative;
  background:
    radial-gradient(800px 500px at 90% -10%, rgba(201,165,78,.16), transparent 60%),
    radial-gradient(700px 500px at -10% 110%, rgba(255,255,255,.05), transparent 60%),
    linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px) 0 0/44px 44px,
    linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px) 0 0/44px 44px,
    linear-gradient(160deg,var(--navy2),var(--navy) 55%,var(--black));}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.badge{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(201,165,78,.5);background:rgba(201,165,78,.1);color:var(--gold2);padding:7px 14px;border-radius:999px;font-size:13px;font-weight:500}
.badge .dot{width:8px;height:8px;border-radius:50%;background:#4ADE80;box-shadow:0 0 0 4px rgba(74,222,128,.18)}
.hero h1{font-family:Fraunces,Georgia,serif;font-size:clamp(44px,7vw,84px);line-height:1.02;margin:22px 0 14px;font-weight:700;letter-spacing:-1px}
.hero h1 em{font-style:normal;color:var(--gold)}
.role{font-size:clamp(18px,2.4vw,24px);color:var(--gold2);font-weight:500}
.lead{max-width:640px;color:#C7CEDB;margin:18px 0 30px;font-size:17px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:10px;font-weight:600;font-size:15px;text-decoration:none;transition:transform .15s, background .2s, border-color .2s}
.btn:hover{transform:translateY(-2px)}
.btn.gold{background:var(--gold);color:var(--black)}
.btn.gold:hover{background:var(--gold2)}
.btn.ghost{border:1px solid rgba(255,255,255,.28);color:#fff;background:rgba(255,255,255,.04)}
.btn.ghost:hover{border-color:var(--gold)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:56px}
.fact{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);border-radius:var(--radius);padding:18px;border-top:2px solid var(--gold)}
.fact b{display:block;font-family:Fraunces,Georgia,serif;font-size:26px;color:var(--gold)}
.fact span{color:#C7CEDB;font-size:13.5px}

/* light sections */
section{padding:80px 0;background:var(--white)}
section.alt{background:var(--off)}
.kicker{color:var(--goldInk);font-size:13px;letter-spacing:3px;text-transform:uppercase;font-weight:600}
h2{font-family:Fraunces,Georgia,serif;font-size:clamp(30px,4vw,42px);margin:8px 0 34px;font-weight:600;color:var(--navy)}
h2::after{content:"";display:block;width:48px;height:3px;background:var(--gold);margin-top:12px}
.dark h2::after,.contact h2::after{margin-left:auto;margin-right:auto}

/* quote band */
section.dark{background:linear-gradient(160deg,var(--navy),var(--black));color:#fff;padding:64px 0}
.quote{border-left:3px solid var(--gold);padding:6px 0 6px 22px;font-family:Fraunces,Georgia,serif;font-size:23px;max-width:760px;font-style:italic}
.quote small{display:block;font-family:Inter,sans-serif;font-style:normal;color:var(--gold2);font-size:13px;margin-top:8px}

/* projects */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.card{border:1px solid var(--line);background:#fff;border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s,border-color .2s;box-shadow:0 1px 2px rgba(11,27,51,.05)}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(11,27,51,.12);border-color:var(--gold)}
.media{aspect-ratio:16/9;position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 78% 22%, rgba(201,165,78,.28), transparent 45%),
    linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px) 0 0/28px 28px,
    linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px) 0 0/28px 28px,
    linear-gradient(135deg,var(--navy2),var(--black));}
.media img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.media .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.media .ph svg{width:72px;height:72px;stroke:var(--gold);fill:none;stroke-width:1.4}
.media .tag{position:absolute;left:14px;top:14px;background:rgba(7,9,15,.78);border:1px solid rgba(201,165,78,.4);color:var(--gold2);font-size:12px;padding:4px 10px;border-radius:999px;font-weight:500}
.body{padding:22px;display:flex;flex-direction:column;gap:10px;flex:1}
.body h3{font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:600;color:var(--navy)}
.meta{color:var(--goldInk);font-size:13px;font-weight:500}
.body p{color:#3A4456;font-size:15px}
.mlinks{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.mlinks a{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;text-decoration:none;background:var(--navy);color:#fff}
.mlinks a.alt{background:#fff;color:var(--navy);border:1px solid var(--line)}
.mlinks a:hover{background:var(--gold);color:var(--black)}
/* live demo affordances */
.plead{color:#3A4456;font-size:16px;max-width:640px;margin:-6px 0 28px;display:flex;gap:10px;align-items:flex-start}
.plead i{flex:none;width:9px;height:9px;border-radius:50%;background:#2FBF71;margin-top:8px;box-shadow:0 0 0 0 rgba(47,191,113,.5);animation:livep 1.8s infinite}
@keyframes livep{0%{box-shadow:0 0 0 0 rgba(47,191,113,.5)}70%{box-shadow:0 0 0 8px rgba(47,191,113,0)}100%{box-shadow:0 0 0 0 rgba(47,191,113,0)}}
.media .live{position:absolute;right:14px;bottom:14px;display:inline-flex;align-items:center;gap:7px;background:rgba(7,9,15,.82);color:#fff;font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(4px)}
.media .live i{width:7px;height:7px;border-radius:50%;background:#2FBF71;animation:livep 1.8s infinite}
.media .live.anim i{background:var(--gold2);animation:none}
.card:hover .media .live{background:var(--gold);color:var(--black);border-color:var(--gold)}
.card:hover .media .live i{background:var(--black)}
.mlinks a.demo{padding:13px 20px;font-size:15px;background:var(--gold);color:var(--black);box-shadow:0 8px 22px rgba(201,165,78,.35)}
.mlinks a.demo:hover{background:var(--navy);color:#fff}
.mlinks a.demo svg{width:16px;height:16px}
.demonote{flex-basis:100%;font-size:13px;color:#5B6577;margin-top:-2px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:auto;padding-top:8px}
.chip{font-size:12px;border:1px solid #D9DEE7;background:#F1F4F9;padding:4px 10px;border-radius:999px;color:var(--navy);font-weight:500}

.card{cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0}
.card:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.more{color:var(--navy);font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:center;margin-top:4px}
.more span{color:var(--gold);transition:transform .2s}
.card:hover .more span{transform:translateX(4px)}
dialog#modal{margin:auto;border:0;padding:0;border-radius:18px;max-width:820px;width:calc(100% - 32px);max-height:calc(100vh - 48px);max-height:calc(100dvh - 48px);overflow:hidden;color:var(--ink);background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.4)}
dialog#modal[open]{display:flex;flex-direction:column}
dialog#modal.fallback{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:100}
.mscroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.mbackdrop{position:fixed;inset:0;background:rgba(7,9,15,.72);z-index:99}
html.lock,html.lock body{overflow:hidden}
.mbody .team{display:inline-block;font-size:13px;font-weight:600;color:var(--navy);background:#F1F4F9;border:1px solid #D9DEE7;border-radius:999px;padding:4px 12px;margin-bottom:4px}
@media (min-width:861px){.card.wide{grid-column:1/-1;flex-direction:row}.card.wide .media{flex:0 0 56%;aspect-ratio:auto;min-height:330px}}
dialog#modal::backdrop{background:rgba(7,9,15,.72);backdrop-filter:blur(3px)}
.mclose{position:absolute;top:12px;right:12px;z-index:3;width:40px;height:40px;border-radius:50%;border:0;background:rgba(7,9,15,.8);color:#fff;font-size:24px;line-height:1;cursor:pointer}
.mclose:hover{background:var(--gold);color:var(--black)}
.mgal .main{aspect-ratio:16/9;background:linear-gradient(135deg,var(--navy2),var(--black));position:relative;display:flex;align-items:center;justify-content:center}
.mgal .main img{width:100%;height:100%;object-fit:contain;background:#0b0f18}
.mgal .main svg{width:84px;height:84px;stroke:var(--gold);fill:none;stroke-width:1.4}
.thumbs{display:flex;gap:8px;padding:10px 24px 0;overflow-x:auto}
.thumbs img{width:96px;height:60px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid transparent;opacity:.7}
.thumbs img.on{border-color:var(--gold);opacity:1}
.mbody{padding:24px 28px 30px}
.mbody h3{font-family:Fraunces,Georgia,serif;font-size:28px;color:var(--navy);margin:4px 0 16px}
.mbody h4{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--goldInk);margin:18px 0 6px}
.mbody p,.mbody li{color:#3A4456;font-size:15.5px}
.mbody ul{padding-left:20px}
.mbody li{margin:4px 0}

/* timeline */
.tl{position:relative;padding-left:30px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--gold),var(--navy))}
.item{position:relative;margin-bottom:30px}
.item::before{content:"";position:absolute;left:-30px;top:6px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--gold)}
.item .when{color:var(--goldInk);font-size:13px;font-weight:600;letter-spacing:.5px}
.item h3{font-size:18px;font-weight:600;margin:2px 0;color:var(--navy)}
.item .where{color:var(--muted);font-size:14px;margin-bottom:6px}
.item ul{padding-left:18px;color:#3A4456;font-size:15px}
.item li{margin:3px 0}

/* skills */
.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.sk{border:1px solid var(--line);border-radius:var(--radius);padding:20px;background:#fff;border-top:3px solid var(--navy)}
.sk h3{font-size:15px;color:var(--navy);margin-bottom:12px;letter-spacing:.5px}

/* contact */
.contact{border-radius:22px;padding:52px;text-align:center;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(600px 300px at 50% 0%, rgba(201,165,78,.18), transparent 70%), linear-gradient(160deg,var(--navy2),var(--black))}
.contact .kicker{color:var(--gold)}
.contact h2{color:#fff}
.contact p{color:#C7CEDB;max-width:560px;margin:0 auto 26px}
.contact .cta{justify-content:center}
footer{padding:32px 0 40px;color:#8C96A8;font-size:13px;text-align:center;background:var(--black)}

/* reveal */
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s ease, transform .7s ease}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}

@media (max-width:860px){
  .grid,.skills{grid-template-columns:1fr}
  .facts{grid-template-columns:repeat(2,1fr)}
  .links a{display:none}
  .hero{padding:64px 0 56px}
  .contact{padding:34px 20px}
}
.err{display:none;position:fixed;left:16px;right:16px;bottom:16px;z-index:200;background:#7F1D1D;color:#fff;padding:14px 18px;border-radius:12px;font-size:14px;line-height:1.5;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.err b{display:block;font-size:15px}
</style>

const S=window.SITE;
const ICONS={
 screen:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4M7 9h4M7 12h7"/>',
 music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',

 chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',

  $('facts').innerHTML=S.facts.map(f=>`<div class="fact rv in"><b>${esc(tx(f.big,l))}</b><span>${esc(tx(f.text,l))}</span></div>`).join('');
  renderCards(l);
  $('timeline').innerHTML=S.experience.map(e=>`<div class="item rv in"><div class="when">${esc(tx(e.when,l))}</div><h3>${esc(tx(e.title,l))}</h3><div class="where">${esc(tx(e.place,l))}</div>${(e.points||[]).length?`<ul>${e.points.map(p=>`<li>${esc(tx(p,l))}</li>`).join('')}</ul>`:''}</div>`).join('');
  $('skillgrid').innerHTML=S.skills.map(g=>`<div class="sk rv in"><h3>${esc(tx(g.group,l))}</h3><div class="chips">${g.items.map(i=>`<span class="chip">${esc(tx(i,l))}</span>`).join('')}</div></div>`).join('');
  $('quote').textContent=tx(S.quote.text,l); $('qauthor').textContent='— '+S.quote.author;
  $('c-title').textContent=tx(S.contact.title,l); $('c-text').textContent=tx(S.contact.text,l);
  $('c-cta').innerHTML=`<a class="btn gold" href="mailto:${esc(P.email)}">${esc(P.email)}</a>${social}<a class="btn ghost" href="${esc(cv)}" download>${esc(L.cv)}</a>`;
  $('foot').textContent=`${P.firstName} ${P.lastName} · ${P.city||''}`;
  modal.querySelector('.mclose').setAttribute('aria-label',L.close);
  try{localStorage.setItem('lang',l)}catch(e){}
}

function renderCards(l){
  const g=$('pgrid'), L=S.labels[l]; g.innerHTML='';
  S.projects.forEach(p=>{
    const d=p[l]||p.en, cover=(p.images||[])[0];
    const c=document.createElement('button'); c.className='card rv in'; c.type='button';
    c.innerHTML=`<div class="media">${cover?`<img src="${esc(cover)}" alt="" loading="lazy">`:`<div class="ph">${icon(p.icon)}</div>`}${tx(p.label,l)?`<span class="tag">${esc(tx(p.label,l))}</span>`:''}${(p.links||{}).screen?`<span class="live${p.demo==='animated'?' anim':''}"><i></i>${esc(p.demo==='animated'?L.badgeAnim:L.badge)}</span>`:''}</div>
      <div class="body"><h3>${esc(d.title)}</h3><div class="meta">${esc(d.date)}</div><p>${esc(d.summary)}</p>
      <div class="chips">${(p.tools||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>
      <div class="more">${esc(L.more)} <span>→</span></div></div>`;
    c.onclick=()=>openModal(p); g.appendChild(c);
  });
  if(S.projects.length%2&&g.lastElementChild) g.lastElementChild.classList.add('wide');
}

const modal=$('modal'), bd=$('mbackdrop');
function openModal(p){
  const l=lang, d=p[l]||p.en, L=S.labels[l], imgs=p.images||[], k=p.links||{};
  $('m-meta').textContent=d.date; $('m-title').textContent=d.title;
  $('m-content').innerHTML=`${d.team?`<div class="team">${esc(d.team)}</div>`:''}
    ${d.context?`<h4>${esc(L.context)}</h4><p>${esc(d.context)}</p>`:''}
    ${(d.did||[]).length?`<h4>${esc(d.team?L.didTeam:L.didSolo)}</h4><ul>${d.did.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    ${d.result?`<h4>${esc(L.result)}</h4><p>${esc(d.result)}</p>`:''}`;
  $('m-chips').innerHTML=(p.tools||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('');
  $('m-links').innerHTML=(k.screen?`<a class="demo" href="${esc(k.screen)}${k.screen.indexOf('?')<0?'?lang='+l:''}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>${esc(p.demo==='animated'?L.screenAnim:L.screen)} ↗</a><span class="demonote">${esc(p.demo==='animated'?L.demoNoteAnim:L.demoNote)}</span>`:'')+(k.report?`<a class="alt" href="${esc(k.report)}" target="_blank" rel="noopener">${esc(L.report)}</a>`:'')+(k.code?`<a class="alt" href="${esc(k.code)}" target="_blank" rel="noopener">${esc(L.code)}</a>`:'');
  $('m-links').style.display=(k.screen||k.report||k.code)?'':'none';
  const gal=$('m-gal');
  if(!imgs.length){gal.innerHTML=`<div class="main">${icon(p.icon)}</div>`;}
  else{
    gal.innerHTML=`<div class="main"><img id="m-main" src="${esc(imgs[0])}" alt="${esc(d.title)}"></div>`+(imgs.length>1?`<div class="thumbs">${imgs.map((s,i)=>`<img src="${esc(s)}" class="${i?'':'on'}" alt="">`).join('')}</div>`:'');
    gal.querySelectorAll('.thumbs img').forEach(t=>t.onclick=()=>{$('m-main').src=t.src;gal.querySelectorAll('.thumbs img').forEach(x=>x.classList.toggle('on',x===t));});
  }
  if(typeof modal.showModal==='function'){ if(!modal.open) modal.showModal(); }
  else { modal.setAttribute('open',''); modal.classList.add('fallback'); bd.hidden=false; }
  document.documentElement.classList.add('lock');
  $('mscroll').scrollTop=0;
}
function closeModal(){
  if(modal.classList.contains('fallback')){ modal.removeAttribute('open'); modal.classList.remove('fallback'); bd.hidden=true; }
  else if(modal.open) modal.close();
  document.documentElement.classList.remove('lock');
}
modal.addEventListener('close',()=>document.documentElement.classList.remove('lock'));
modal.querySelector('.mclose').onclick=closeModal;
modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});
bd.onclick=closeModal;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>render(b.dataset.lang));
let start=new URLSearchParams(location.search).get('lang');
if(!start){try{start=localStorage.getItem('lang')}catch(e){}}
if(!start) start=(navigator.language||'en').toLowerCase().startsWith('fr')?'fr':'en';
render(start==='fr'?'fr':'en');
$('yr').textContent=new Date().getFullYear();
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.12});
document.querySelectorAll('.rv').forEach(el=>io.observe(el));
})();
</script>
<script>
/* CV download inside the Claude page viewer (does nothing on a normal website) */
(function(){
  if(!window.claude||typeof window.claude.use!=='function')return;
  var dl=null; window.claude.use('downloads').then(function(d){dl=d;}).catch(function(){});
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[download]'); if(!a||!dl)return;
    e.preventDefault();
    var href=a.getAttribute('href'), name=href.split('/').pop();
    fetch(href).then(function(r){return r.blob();}).then(function(b){return dl.save({filename:name,data:b});})
      .catch(function(err){ if(!err||err.code!=='declined') window.open(href,'_blank'); });
  },true);
})();
</script>
